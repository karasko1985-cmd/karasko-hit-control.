services:
  - type: web
    name: karasko-hit-control
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: OPENAI_REASONING_EFFORT
        value: high
      - key: MAX_AI_CALLS
        value: "7"
      - key: OPENAI_TIMEOUT_MS
        value: "600000"
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
